[versions]
agp                    = "8.3.2"
kotlin                 = "1.9.23"
compose-bom            = "2024.04.01"
compose-compiler       = "1.5.13"
core-ktx               = "1.13.1"
lifecycle              = "2.7.0"
activity-compose       = "1.9.0"
navigation-compose     = "2.7.7"
room                   = "2.6.1"
okhttp                 = "4.12.0"
jsoup                  = "1.17.2"
coroutines             = "1.8.1"
coil                   = "2.6.0"
ksp                    = "1.9.23-1.0.20"

[libraries]
# AndroidX core
core-ktx               = { group = "androidx.core",             name = "core-ktx",                      version.ref = "core-ktx" }
lifecycle-runtime      = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",          version.ref = "lifecycle" }
lifecycle-viewmodel    = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
lifecycle-compose     = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",      version.ref = "lifecycle" }
activity-compose       = { group = "androidx.activity",         name = "activity-compose",               version.ref = "activity-compose" }

# Compose BOM — pins all compose versions together
compose-bom            = { group = "androidx.compose",          name = "compose-bom",                   version.ref = "compose-bom" }
compose-ui             = { group = "androidx.compose.ui",       name = "ui" }
compose-ui-tooling     = { group = "androidx.compose.ui",       name = "ui-tooling" }
compose-ui-preview     = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
compose-material3      = { group = "androidx.compose.material3",name = "material3" }
compose-icons          = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
navigation-compose     = { group = "androidx.navigation",       name = "navigation-compose",             version.ref = "navigation-compose" }

# Room
room-runtime           = { group = "androidx.room",             name = "room-runtime",                   version.ref = "room" }
room-ktx               = { group = "androidx.room",             name = "room-ktx",                      version.ref = "room" }
room-compiler          = { group = "androidx.room",             name = "room-compiler",                  version.ref = "room" }

# Networking & Scraping
okhttp                 = { group = "com.squareup.okhttp3",      name = "okhttp",                        version.ref = "okhttp" }
jsoup                  = { group = "org.jsoup",                  name = "jsoup",                         version.ref = "jsoup" }

# Coroutines
coroutines-core        = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-core",       version.ref = "coroutines" }
coroutines-android     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",    version.ref = "coroutines" }

# Image loading
coil                   = { group = "io.coil-kt",                name = "coil-compose",                  version.ref = "coil" }

[plugins]
android-application    = { id = "com.android.application",      version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp",       version.ref = "ksp" }
