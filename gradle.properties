# ── JVM heap: capped for Core 2 Duo / 7.5 GB RAM ─────────────────────────
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ── Gradle daemon: reuse between builds (saves cold-start time) ───────────
org.gradle.daemon=true
org.gradle.daemon.idletimeout=1800000

# ── Parallel: OFF (single-core safer on dual-core machine) ────────────────
org.gradle.parallel=false

# ── Configuration cache (speeds up incremental builds) ───────────────────
org.gradle.configuration-cache=true

# ── Kotlin / Android ─────────────────────────────────────────────────────
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
